name: tmp-deploy-20261018
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download site-deploy-2026-10-18 --repo davidmeiselmanarchive/david-meiselman-archive --pattern 'the-david-meiselman-archive.html'
      - name: Promote to index.html and commit
        run: |
          mv -f the-david-meiselman-archive.html index.html
          git config user.name "davidmeiselmanarchive"
          git config user.email "davidmeiselmanarchive@users.noreply.github.com"
          git add index.html
          git commit -m "Daily archive sync 2026-10-18"
          git push
