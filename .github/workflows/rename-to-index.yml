name: Rename archive file to index.html

on:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename the-david-meiselman-archive.html to index.html
        run: |
          if [ -f the-david-meiselman-archive.html ]; then
            git config user.name "davidmeiselmanarchive"
            git config user.email "davidmeiselmanarchive@users.noreply.github.com"
            git mv the-david-meiselman-archive.html index.html
            git commit -m "Add Research finds section + SEO tags"
            git push
          else
            echo "the-david-meiselman-archive.html not present; nothing to do."
          fi
