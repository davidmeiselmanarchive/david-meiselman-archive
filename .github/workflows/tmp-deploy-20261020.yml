name: tmp-deploy-20261020
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Download release asset
        run: gh release download site-deploy-2026-10-20 -p the-david-meiselman-archive.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish index.html to main
        run: |
          mv -f the-david-meiselman-archive.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily archive sync 2026-10-20"
          git push
