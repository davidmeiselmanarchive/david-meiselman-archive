name: tmp-deploy-20261101
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download site-deploy-2026-11-01 --pattern the-david-meiselman-archive.html --dir . --clobber
      - name: Deploy to index.html
        run: |
          mv -f the-david-meiselman-archive.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily archive sync 2026-11-01"
          git push
