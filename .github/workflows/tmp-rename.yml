name: tmp-rename
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "davidmeiselmanarchive"
          git config user.email "davidmeiselmanarchive@users.noreply.github.com"
          git mv the-david-meiselman-archive.html index.html
          git commit -m "Daily archive sync 2026-10-15"
          git push
