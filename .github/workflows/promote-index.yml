name: Promote uploaded index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download site-deploy-20261016 --pattern 'the-david-meiselman-archive.html' --repo ${{ github.repository }}
      - name: Replace index.html and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv -f the-david-meiselman-archive.html index.html
          git add index.html
          git commit -m "Deploy updated index.html" || echo "nothing to commit"
          git push origin HEAD:main
