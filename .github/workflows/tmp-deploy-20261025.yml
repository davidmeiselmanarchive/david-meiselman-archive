name: tmp-deploy-20261025
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy release asset as index.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download site-deploy-2026-10-25 -p the-david-meiselman-archive.html
          mv -f the-david-meiselman-archive.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily archive sync 2026-10-25"
          git push
